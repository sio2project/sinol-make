name: pytest-arch
run-name: Run pytest on Arch Linux
on:
  push:
    branches: 'main'
  pull_request:
permissions:
  contents: read
concurrency:
  # A new push to a PR cancels its older runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
        matrix:
            python-version: ["3.11", "3.15"]
    name: pytest-arch-python-${{ matrix.python-version }}
    container:
      image: ghcr.io/sio2project/sinol-make-ci:arch
      options:
        --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare system
        run: |
          sysctl kernel.perf_event_paranoid=-1
          mkdir -p ~/.local/bin && ln -sf /usr/local/bin/sio2jail ~/.local/bin/sio2jail
      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /opt/venv
          echo /opt/venv/bin >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          pip3 install .[tests]
      - name: Run pytest
        env:
          PYTEST_ADDOPTS: "--color=yes"
        run: |
          python3 -m pytest -v -n $((`nproc` / 2)) --timeout=900 --timeout-method=thread
