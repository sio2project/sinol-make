name: pytest-macos
run-name: Run pytest on macOS
on:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'

permissions:
  contents: read
concurrency:
  # A new push to a PR cancels its older runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: macos-latest
    strategy:
        matrix:
            python-version: ["3.11", "3.15"]
    name: pytest-macos-python-${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare system
        run: |
          rm -f '/usr/local/bin/2to3' # Homebrew will fail if this exists
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      - name: Install Homebrew dependencies
        run: |
          rm -f /usr/local/bin/2to3* /usr/local/bin/python3* /usr/local/bin/idle3* \
          /usr/local/bin/pydoc3* # Homebrew will fail if these exist
          brew install gnu-time coreutils diffutils dpkg ghostscript texlive virtualenv
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .[tests]
      - name: Run pytest
        env:
          PYTEST_ADDOPTS: "--color=yes"
        run: |
          source .venv/bin/activate
          pytest -v --time-tool time
