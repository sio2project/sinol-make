name: pytest-ubuntu
run-name: Run pytest on Ubuntu
on:
  push:
    branches: 'main'
  pull_request:
permissions:
  contents: read

jobs:
  pytest:
    # Self-hosted runner: never run code from fork PRs on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    strategy:
        matrix:
            python-version: ["3.9", "3.13"]
    name: pytest-ubuntu-python-${{ matrix.python-version }}
    container:
      image: ubuntu:latest
      volumes:
        - /home/actions/oiejq:/github/home/.local/bin
      env:
        DEB_PYTHON_INSTALL_LAYOUT: deb
        DEBIAN_FRONTEND: noninteractive
        TZ: Europe/Warsaw
      options:
        --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare system
        run: |
          apt update
          apt install -y sqlite3 sqlite3-doc build-essential dpkg texlive-latex-extra ghostscript git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          sysctl kernel.perf_event_paranoid=-1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip3 install .[tests]
          apt install -y time
      - name: Run pytest
        env:
          PYTEST_ADDOPTS: "--color=yes"
        run: |
          python3 -m pytest -v -n $((`nproc` / 2))
