name: pytest-github-runner
run-name: Run tests for GitHub Runner
on:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'
permissions:
  contents: read
concurrency:
  # A new push to a PR cancels its older runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    strategy:
        matrix:
            python-version: ["3.11", "3.15"]
    name: pytest-github-runner-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install .[tests]
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended ghostscript
      - name: Run github runner pytest
        env:
          PYTEST_ADDOPTS: "--color=yes"
        run: |
          python -m pytest -v --github-runner
